packages:
  - packages/*

# msgpackr-extract is an optional native accelerator for effect's msgpackr;
# it has a JS fallback, so skip the postinstall build.
allowBuilds:
  "@google/genai": true
  esbuild: true
  msgpackr-extract: false
  protobufjs: true
  sharp: false
  workerd: true

patchedDependencies:
  effect-machine@0.17.1: patches/effect-machine@0.17.1.patch
