name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the version from package.json's packageManager (pnpm 11).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      # packages/deploy runs on bun: tests, alchemy, the local workerd harness.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm exec vp fmt --check
      # The deploy suite boots the real stack in local workerd (ephemeral
      # ports, SAKU_FAKE_MODEL) — no cloud credentials required.
      - run: pnpm test
      - run: pnpm build
